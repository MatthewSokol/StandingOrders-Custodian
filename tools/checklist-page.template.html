<title>Custodian Release Checklist</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans+SC:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style id="app-style">
/* Layout: one centred column; a build-and-progress header, then one card per stage with rows that say who does and who ticks them. Same system as the Waterboy release checklist. */
:root {
  --bg: #f3f6f9; --surface: #ffffff; --ink: #14213a; --muted: #5b6880; --line: #d9e1ea;
  --accent: #1f6fb8; --accent-soft: #e2eefa; --done: #17806d; --done-soft: #def3ee;
  --exec: #6a4fb3; --exec-soft: #ece7f8; --bad: #b3392f; --bad-soft: #f8e4e1; --warn: #a35a0c; --warn-soft: #f8ebd8;
  --font-display: "Alegreya Sans SC", "Trebuchet MS", sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d1524; --surface: #142036; --ink: #e4ebf5; --muted: #9aa8bf; --line: #253552;
  --accent: #6cb2f2; --accent-soft: #1b3150; --done: #4fd1b5; --done-soft: #143a38;
  --exec: #b9a5f5; --exec-soft: #2a2350; --bad: #f08a7e; --bad-soft: #3d1f1d; --warn: #f0b062; --warn-soft: #3a2a14; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0d1524; --surface: #142036; --ink: #e4ebf5; --muted: #9aa8bf; --line: #253552;
  --accent: #6cb2f2; --accent-soft: #1b3150; --done: #4fd1b5; --done-soft: #143a38;
  --exec: #b9a5f5; --exec-soft: #2a2350; --bad: #f08a7e; --bad-soft: #3d1f1d; --warn: #f0b062; --warn-soft: #3a2a14; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 28px 48px }
main { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px }
h1, h2 { font-family: var(--font-display); font-weight: 700; margin: 0; text-wrap: balance; letter-spacing: .01em }
h1 { font-size: 2rem; line-height: 1.1 }
h2 { font-size: 1.3rem }
.cmd.link { color: var(--accent); font-weight: 600; cursor: pointer; text-decoration: underline }
code, .cmd { font-family: var(--font-mono); font-size: .84em; background: var(--accent-soft); color: var(--ink); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere }
.cmd { border: 0; cursor: copy; text-align: left; line-height: inherit }
.cmd:hover { outline: 1px solid var(--accent) }
.cmd.copied { background: var(--done); color: var(--surface) }
header { display: flex; flex-direction: column; gap: 12px }
.build { font: 500 .8rem var(--font-mono); color: var(--accent); letter-spacing: .04em; overflow-wrap: anywhere }
.sub { color: var(--muted); margin: 0; max-width: 64ch }
.bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap }
.meter { flex: 1 1 200px; height: 10px; background: var(--line); border-radius: 99px; overflow: hidden }
.meter > span { display: block; height: 100%; background: var(--done); width: 0; transition: width .25s ease }
.count { font-variant-numeric: tabular-nums; font-weight: 600 }
.nprob { font-weight: 600; color: var(--bad) }
.nprob.zero { color: var(--done) }
.status { font-size: .82rem; color: var(--muted); border: 1px solid var(--line); border-radius: 99px; padding: 2px 10px; white-space: nowrap }
.status.saving { color: var(--accent); border-color: var(--accent) }
.status.local { color: var(--warn); border-color: var(--warn) }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .84rem; color: var(--muted); margin: 0; padding: 0; list-style: none }
.legend li { display: flex; align-items: center; gap: 6px }
button { font: inherit; font-size: .82rem; color: var(--ink); background: var(--surface); border: 1px solid var(--line);
  border-radius: 8px; padding: 4px 10px; cursor: pointer }
button:hover { border-color: var(--accent) }
button:focus-visible, input:focus-visible + .box, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: .85rem; color: var(--muted) }
.danger { color: var(--bad); border-color: var(--bad) }
section { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden }
section > .head { margin: 0; font-size: 1.3rem }
section:not(.closed) > .head { border-bottom: 1px solid var(--line) }
.sec-toggle { width: 100%; display: flex; align-items: baseline; gap: 10px; padding: 14px 18px 10px; border: 0; border-radius: 0;
  background: none; font: inherit; color: inherit; text-align: left; cursor: pointer }
.sec-toggle:hover { background: var(--accent-soft); border: 0 }
.sec-toggle .chev { font-size: .8em; color: var(--muted); width: 1em; flex-shrink: 0 }
.sec-toggle .title { flex: 1; min-width: 0 }
.sec-toggle .count { font: 500 .85rem var(--font-body); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap }
.sec-toggle .secprob { font: 600 .8rem var(--font-body); color: var(--bad); white-space: nowrap }
section.complete .sec-toggle .count { color: var(--done) }
.part { font: 700 1.05rem var(--font-display); color: var(--muted); margin: 6px 0 -10px; letter-spacing: .02em }
.waiting { margin: 0; font-weight: 600; color: var(--accent) }
.sec-toggle .ver { font: 500 .7em var(--font-mono); color: var(--muted) }
.fold-all { display: flex; gap: 8px; justify-content: space-between; flex-wrap: wrap; margin-bottom: -8px }
.fold-all .grp { display: flex; gap: 8px; flex-wrap: wrap }
.fold-all .grp button[aria-pressed="true"] { color: var(--surface); background: var(--accent); border-color: var(--accent) }
section .note { margin: 0; padding: 8px 18px 0; color: var(--muted); font-size: .85rem }
ul.rows { list-style: none; margin: 0; padding: 4px 0 }
.row { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 4px 12px; padding: 10px 18px }
.row + .row { border-top: 1px solid var(--line) }
.row.flagged { box-shadow: inset 3px 0 0 var(--bad) }
.row.fixed { box-shadow: inset 3px 0 0 var(--done) }
.row.child { padding-left: 46px; background: var(--bg) }
.empty { padding: 12px 18px; color: var(--muted); font-size: .9rem }
.tick { position: relative; margin-top: 2px; width: 20px; height: 20px; cursor: pointer }
.tick input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer }
.tick input:disabled { cursor: not-allowed }
.box { width: 20px; height: 20px; border: 2px solid var(--muted); border-radius: 5px; display: grid; place-items: center; background: var(--surface) }
.box svg { width: 13px; height: 13px; opacity: 0 }
.tick input:checked + .box { background: var(--done); border-color: var(--done) }
.tick input:checked + .box svg { opacity: 1 }
.tick input:disabled:not(:checked) + .box { border-style: dashed; background: var(--accent-soft) }
.row.over .tick input + .box { background: var(--warn); border-color: var(--warn) }
.row.over .tick input + .box svg { opacity: 1 }
.text { min-width: 0; display: flex; flex-direction: column; gap: 4px }
.what { display: block }
.row.done .what { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line) }
.num { font: 500 .82em var(--font-mono); color: var(--accent); font-variant-numeric: tabular-nums; margin-right: 2px }
h2 .num { font-size: .8em }
.badges { display: flex; flex-wrap: wrap; gap: 6px }
.badge { font: 500 .72rem/1.6 var(--font-mono); padding: 0 7px; border-radius: 99px; white-space: nowrap; letter-spacing: .01em }
.badge.exec { color: var(--exec); background: var(--exec-soft) }
.badge.valid { color: var(--accent); background: var(--accent-soft) }
.badge.fix { color: var(--bad); background: var(--bad-soft) }
.badge.over { color: var(--warn); background: var(--warn-soft) }
.tools { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px }
.flag[aria-pressed="true"] { color: var(--surface); background: var(--bad); border-color: var(--bad) }
.overbtn[aria-pressed="true"] { color: var(--surface); background: var(--warn); border-color: var(--warn) }
.notebox { display: flex; flex-direction: column; gap: 6px; margin-top: 4px }
.notebox label { font-size: .8rem; color: var(--muted) }
.notebox textarea { font: .88rem/1.4 var(--font-body); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; resize: vertical; min-height: 2.6em; width: 100% }
.notebox .acts { display: flex; gap: 6px; flex-wrap: wrap; align-items: center }
.notebox .err { color: var(--bad); font-size: .8rem }
.saved-note { font-size: .86rem; color: var(--ink); background: var(--bg); border-left: 3px solid var(--line); padding: 4px 8px; border-radius: 4px; overflow-wrap: anywhere }
.saved-note.bad { border-left-color: var(--bad) }
.saved-note.over { border-left-color: var(--warn) }
.saved-note.ok { border-left-color: var(--done) }
.paste-copy { align-self: flex-start; font-weight: 600 }
details.paste summary { cursor: pointer; color: var(--accent); font-size: .85rem }
details.paste pre { font: .8rem/1.45 var(--font-mono); white-space: pre-wrap; overflow-wrap: anywhere; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; max-height: 320px; overflow: auto; margin: 6px 0 0 }
footer { color: var(--muted); font-size: .82rem; text-align: center; max-width: 64ch; margin: 0 auto }
@media (prefers-reduced-motion: reduce) { .meter > span { transition: none } }
</style>

<main id="app">
  <header>
    <h1>Custodian Release Checklist</h1>
    <p class="sub">Standing Orders: Custodian, the next release.</p>
  </header>
  <p class="sub" id="loading">Loading the checklist…</p>
</main>

<script type="application/json" id="state">__STATE__</script>
<script id="app-script">
(function () {
  // Built by tools/checklist-page.js from RELEASING.md and TESTING.md. Item: {id, oid, text, hint, exec, valid}:
  // exec = trigger (Claude runs it unasked), valid = the proof that ticks it (only Claude ticks those). Standing
  // sections stay across releases; each unit of work since the last release is its own 2.2.n section.
  var SECTIONS = __SECTIONS__;
  var WAITING = __WAITING__;

  var STASH = "soc-checklist-pending";
  var stateEl = document.getElementById("state");
  var state;
  try { state = JSON.parse(stateEl.textContent) } catch (e) { state = {} }
  if (!state || typeof state !== "object") state = {};
  ["checked", "flags", "overrides", "triage"].forEach(function (k) { if (!state[k] || typeof state[k] !== "object") state[k] = {} });
  try {
    var pending = JSON.parse(sessionStorage.getItem(STASH) || "null");
    if (pending && pending.checked) state = pending;
  } catch (e) {}

  var artifact = null, mode = "connecting", saveTimer = null, dirty = false, openBox = null;
  // Open sections and the filter are this viewer's own choice, kept in browser storage, never in the saved page.
  var OPEN_KEY = "soc-checklist-open", openMap = {}, toggled = {}, filter = "all";
  try { openMap = JSON.parse(localStorage.getItem(OPEN_KEY) || "{}") || {} } catch (e) { openMap = {} }
  try { filter = localStorage.getItem("soc-filter") || "all" } catch (e) {}
  function saveOpen() { try { localStorage.setItem(OPEN_KEY, JSON.stringify(openMap)) } catch (e) {} }
  function isOpen(s, finished, needsYou) {
    if (toggled[s.id] !== undefined) return toggled[s.id];
    if (needsYou) return true;
    if (openMap[s.id] !== undefined) return !!openMap[s.id];
    return !finished;
  }
  var app = document.getElementById("app");
  var CHECK = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3.2 3L13 4.5" fill="none" stroke="var(--surface)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;" }[c] }) }
  // Markdown-ish row text: **bold**, [links](https://…) that open in a new tab, and `commands` as grey buttons that copy themselves
  function fmt(s) {
    return esc(s).replace(/\[([^\]]+)\]\((https:\/\/[^)\s]+)\)/g, function (m, label, url) {
      // The page's sandbox may block new tabs, so a click also copies the link (the .cmd handler below)
      return '<a class="cmd link" href="' + url + '" data-copy="' + url + '" target="_blank" rel="noopener" title="Opens in a new tab and copies the link">' + label.replace(/`/g, "") + " ↗</a>";
    }).replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>").replace(/`([^`]+)`/g, function (m, c) {
      return '<button type="button" class="cmd" data-copy="' + c + '" title="Click to copy">' + c + "</button>";
    });
  }
  // Fix and Re-test rows Claude adds under a flagged row while triaging it (state.triage[id] = {fix, retest, fixed})
  function rowsOf(sec) {
    var out = [];
    sec.items.forEach(function (it) {
      out.push(it);
      var t = state.triage[it.id];
      if (t && state.flags[it.id] !== undefined) {
        if (t.fix) out.push({ id: "fix-" + it.id, oid: it.oid + ".fix", text: "Fix (Claude): " + t.fix + (t.fixed ? " Done." : ""), child: true, fix: true, valid: "the fix's build", exec: "when the problem is triaged" });
        if (t.retest) out.push({ id: "retest-" + it.id, oid: it.oid + ".retest", text: "Re-test: " + t.retest, child: true, retest: true });
      }
    });
    return out;
  }
  function allRows() { var a = []; SECTIONS.forEach(function (s) { a = a.concat(rowsOf(s)) }); return a }
  function overridden(id) { return typeof state.overrides[id] === "string" && state.overrides[id].trim() !== "" }
  function isDone(r) { return !!state.checked[r.id] || overridden(r.id) }
  function resolved(id) { return !!(state.triage[id] && state.checked["retest-" + id]) }
  function isProblem(id) { return state.flags[id] !== undefined && !resolved(id) }
  function nProblems() { return Object.keys(state.flags).filter(isProblem).length }

  function el(tag, cls, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e }
  function btn(cls, text, id) { var b = el("button", cls, text); b.type = "button"; if (id) b.id = id; return b }

  function noteBox(r, kind) {
    var wrap = el("div", "notebox");
    var tid = kind + "-note-" + r.id;
    var lab = el("label", null, kind === "problem" ? "What happened? Claude triages it the next time it reads this page." : "Why ship it anyway? This note goes into the release notes as a known issue.");
    lab.htmlFor = tid;
    var ta = document.createElement("textarea"); ta.id = tid;
    ta.value = (kind === "problem" ? state.flags[r.id] : state.overrides[r.id]) || "";
    var acts = el("div", "acts");
    var ok = btn(kind === "problem" ? "danger" : "", kind === "problem" ? "Save problem" : "Override with this note", "save-" + tid);
    var cancel = btn("", "Cancel", "cancel-" + tid);
    var err = el("span", "err"); err.hidden = true;
    acts.appendChild(ok); acts.appendChild(cancel); acts.appendChild(err);
    wrap.appendChild(lab); wrap.appendChild(ta); wrap.appendChild(acts);
    ok.addEventListener("click", function () {
      var v = ta.value.trim();
      if (!v) { err.textContent = "Write a note first."; err.hidden = false; ta.focus(); return }
      if (kind === "problem") state.flags[r.id] = v; else { state.overrides[r.id] = v; delete state.checked[r.id] }
      openBox = null; changed(); render();
    });
    cancel.addEventListener("click", function () { openBox = null; render() });
    setTimeout(function () { ta.focus() }, 0);
    return wrap;
  }

  function rowEl(r) {
    var li = el("li", "row");
    if (r.child) li.classList.add("child");
    var valid = !!r.valid, over = overridden(r.id), flagged = state.flags[r.id] !== undefined;
    if (isDone(r)) li.classList.add("done");
    if (over) li.classList.add("over");
    if (flagged) li.classList.add(resolved(r.id) ? "fixed" : "flagged");

    var tick = el("label", "tick");
    var input = document.createElement("input"); input.type = "checkbox"; input.id = "chk-" + r.id;
    input.checked = !!state.checked[r.id];
    if (valid) { input.disabled = true; input.title = over ? "Overridden by you" : "Claude ticks this when its proof passes" }
    input.setAttribute("aria-label", "Done: " + String(r.text).replace(/`/g, ""));
    tick.appendChild(input); tick.appendChild(el("span", "box", CHECK));
    input.addEventListener("change", function () {
      if (input.checked) state.checked[r.id] = true; else delete state.checked[r.id];
      changed(); render();
    });

    var text = el("div", "text");
    text.appendChild(el("span", "what", '<span class="num">' + esc(r.oid) + "</span> " + fmt(r.text)));
    if (r.hint) text.appendChild(el("span", "sub", fmt(r.hint)));
    if (r.paste) { // a whole file to paste somewhere: one Copy button, and the text to read first
      var copy = btn("cmd paste-copy", "Copy all of " + esc(r.paste.file) + " (" + r.paste.text.length + " characters)", "copy-" + r.id);
      copy.setAttribute("data-copy", r.paste.text);
      var peek = el("details", "paste"), sum = el("summary", null, "Show the text");
      var pre = el("pre"); pre.textContent = r.paste.text;
      peek.appendChild(sum); peek.appendChild(pre);
      text.appendChild(copy); text.appendChild(peek);
    }
    var badges = el("div", "badges");
    if (r.fix) badges.appendChild(el("span", "badge fix", "fix"));
    if (r.retest) badges.appendChild(el("span", "badge fix", "re-test"));
    if (r.exec) badges.appendChild(el("span", "badge exec", "auto executed · " + esc(r.exec)));
    if (r.valid) badges.appendChild(el("span", "badge valid", "auto validated" + (r.valid === true ? "" : " · " + esc(r.valid))));
    if (over) badges.appendChild(el("span", "badge over", "overridden: known issue"));
    if (badges.childNodes.length) text.appendChild(badges);
    if (over && openBox !== "override-" + r.id) text.appendChild(el("div", "saved-note over", esc(state.overrides[r.id])));
    if (flagged && openBox !== "problem-" + r.id) text.appendChild(el("div", "saved-note " + (resolved(r.id) ? "ok" : "bad"), (resolved(r.id) ? "Fixed: " : "Problem: ") + esc(state.flags[r.id])));

    if (!r.child) {
      var tools = el("div", "tools");
      var flag = btn("flag", flagged ? "Problem noted" : "Problem", "flag-" + r.id);
      flag.setAttribute("aria-pressed", String(flagged));
      flag.addEventListener("click", function () { openBox = openBox === "problem-" + r.id ? null : "problem-" + r.id; render() });
      tools.appendChild(flag);
      if (flagged) {
        var clr = btn("", "Withdraw problem", "unflag-" + r.id);
        clr.addEventListener("click", function () { delete state.flags[r.id]; delete state.triage[r.id]; openBox = null; changed(); render() });
        tools.appendChild(clr);
      }
      if (valid) {
        var ob = btn("overbtn", over ? "Overridden" : "Override", "over-" + r.id);
        ob.setAttribute("aria-pressed", String(over));
        ob.addEventListener("click", function () { openBox = openBox === "override-" + r.id ? null : "override-" + r.id; render() });
        tools.appendChild(ob);
        if (over) {
          var undo = btn("", "Undo override", "unover-" + r.id);
          undo.addEventListener("click", function () { delete state.overrides[r.id]; openBox = null; changed(); render() });
          tools.appendChild(undo);
        }
      }
      text.appendChild(tools);
    }
    if (openBox === "problem-" + r.id) text.appendChild(noteBox(r, "problem"));
    if (openBox === "override-" + r.id) text.appendChild(noteBox(r, "override"));

    li.appendChild(tick); li.appendChild(text);
    return li;
  }

  function render() {
    var y = window.scrollY;
    app.innerHTML = "";
    var rows = allRows(), done = rows.filter(isDone).length, np = nProblems();
    var header = el("header");
    header.appendChild(el("span", "build", "Build under test: " + esc(state.build || "not stamped")));
    header.appendChild(el("h1", null, "Custodian Release Checklist"));
    header.appendChild(el("p", "sub", "Standing Orders: Custodian, the next release. Tick your rows as you go; press Problem on any row that doesn't do what it says. A fix restamps the build and unticks the smoke rows and every row it touches. Click a grey command to copy it."));
    header.appendChild(el("p", "waiting", esc(WAITING)));
    var bar = el("div", "bar");
    var meter = el("div", "meter"); meter.setAttribute("role", "progressbar");
    meter.setAttribute("aria-valuenow", String(done)); meter.setAttribute("aria-valuemax", String(rows.length));
    var fill = el("span"); fill.style.width = (rows.length ? 100 * done / rows.length : 0) + "%"; meter.appendChild(fill);
    bar.appendChild(meter);
    bar.appendChild(el("span", "count", done + " / " + rows.length));
    bar.appendChild(el("span", "nprob" + (np ? "" : " zero"), np ? np + (np === 1 ? " open problem" : " open problems") : "No open problems"));
    bar.appendChild(el("span", "status", ""));
    var reset = btn("", "Clear everything", "clear-all");
    bar.appendChild(reset);
    header.appendChild(bar);
    var confirmRow = el("div", "confirm"); confirmRow.hidden = true;
    confirmRow.appendChild(el("span", null, "Clear every tick, override and problem?"));
    var yes = btn("danger", "Clear them", "clear-yes"), no = btn("", "Keep them", "clear-no");
    confirmRow.appendChild(yes); confirmRow.appendChild(no);
    header.appendChild(confirmRow);
    var legend = el("ul", "legend");
    legend.innerHTML = '<li><span class="badge exec">auto executed · trigger</span> Claude runs it when the trigger is met</li>' +
      '<li><span class="badge valid">auto validated · proof</span> a check proves it; only Claude ticks it, you can Override with a note</li>' +
      "<li>No badge: yours to do and tick</li>" +
      "<li><code>&lt;env&gt;</code> = <code>node ~/.claude/skills/wow-mod-dev/scripts/wow-env.js --client _forever_</code>, game fully closed</li>";
    header.appendChild(legend);
    app.appendChild(header);
    reset.addEventListener("click", function () { confirmRow.hidden = false });
    no.addEventListener("click", function () { confirmRow.hidden = true });
    yes.addEventListener("click", function () { state.checked = {}; state.overrides = {}; state.flags = {}; state.triage = {}; changed(); render() });

    var waiting = null; // the first section with a row still to do: the one Claude or you are on
    SECTIONS.forEach(function (s) { if (!waiting && rowsOf(s).some(function (r) { return !isDone(r) })) waiting = s.id });
    var tools = el("div", "fold-all");
    var grp = el("div", "grp");
    [["all", "All"], ["todo", "To do"], ["flagged", "Problems"]].forEach(function (f) {
      var b = btn("", f[1], "filter-" + f[0]); b.setAttribute("aria-pressed", String(filter === f[0]));
      b.addEventListener("click", function () { filter = f[0]; try { localStorage.setItem("soc-filter", filter) } catch (e) {} render() });
      grp.appendChild(b);
    });
    tools.appendChild(grp);
    var grp2 = el("div", "grp");
    var ex = btn("", "Expand all", "expand-all"), co = btn("", "Collapse all", "collapse-all");
    grp2.appendChild(ex); grp2.appendChild(co);
    tools.appendChild(grp2);
    app.appendChild(tools);
    function setAll(v) { SECTIONS.forEach(function (s) { toggled[s.id] = v; openMap[s.id] = v }); saveOpen(); render() }
    ex.addEventListener("click", function () { setAll(true) });
    co.addEventListener("click", function () { setAll(false) });

    var lastPart = null;
    SECTIONS.forEach(function (s) {
      var rs = rowsOf(s), n = rs.filter(isDone).length;
      var probs = rs.filter(function (r) { return isProblem(r.id) }).length;
      var open = isOpen(s, n === rs.length, probs > 0 || s.id === waiting);
      if (s.part && s.part !== lastPart) { lastPart = s.part; app.appendChild(el("p", "part", esc(s.part))) }
      var sec = el("section"); sec.id = "sec-" + s.id;
      if (n === rs.length) sec.classList.add("complete");
      if (!open) sec.classList.add("closed");
      var h2 = el("h2", "head");
      var tg = btn("sec-toggle", "", "toggle-" + s.id);
      tg.setAttribute("aria-expanded", String(open));
      tg.setAttribute("aria-controls", "body-" + s.id);
      tg.innerHTML = '<span class="chev" aria-hidden="true">' + (open ? "▾" : "▸") + '</span><span class="title"><span class="num">' + esc(s.oid) + "</span> " + esc(s.title) + (s.version ? ' <span class="ver">· ' + esc(s.version) + "</span>" : "") + "</span>" +
        (probs ? '<span class="secprob">' + probs + (probs === 1 ? " problem" : " problems") + "</span>" : "") +
        '<span class="count">' + n + " / " + rs.length + "</span>";
      tg.addEventListener("click", function () { toggled[s.id] = !open; openMap[s.id] = !open; saveOpen(); render() });
      h2.appendChild(tg);
      sec.appendChild(h2);
      var body = el("div", "body"); body.id = "body-" + s.id; body.hidden = !open;
      if (s.note) body.appendChild(el("p", "note", fmt(s.note)));
      var shown = rs.filter(function (r) {
        if (filter === "todo") return !isDone(r);
        if (filter === "flagged") return state.flags[r.id] !== undefined || (r.child && state.flags[r.id.replace(/^(fix|retest)-/, "")] !== undefined);
        return true;
      });
      var ul = el("ul", "rows");
      if (!shown.length) ul.appendChild(el("li", "empty", filter === "todo" ? "All done here." : "No problems here."));
      shown.forEach(function (r) { ul.appendChild(rowEl(r)) });
      body.appendChild(ul);
      sec.appendChild(body);
      app.appendChild(sec);
    });
    app.appendChild(el("footer", null, "Ticks, overrides and problems are saved into this page. Claude reads it when you finish a pass, ticks the auto validated rows whose proof passed, and triages each problem: a Fix row and Re-test rows, deferred only on your word, or the row's text corrected."));
    showStatus();
    window.scrollTo(0, y);
  }

  function showStatus() {
    var st = app.querySelector(".status");
    if (!st) return;
    st.className = "status";
    if (mode === "local") { st.textContent = "Saved in this browser only"; st.classList.add("local") }
    else if (dirty) { st.textContent = "Saving…"; st.classList.add("saving") }
    else if (mode === "connecting") st.textContent = "Connecting…";
    else st.textContent = "Saved";
  }

  document.addEventListener("click", function (e) {
    var t = e.target.closest ? e.target.closest(".cmd") : null;
    if (!t) return;
    var text = t.getAttribute("data-copy");
    var ok = function () { t.classList.add("copied"); setTimeout(function () { t.classList.remove("copied") }, 900) };
    var sel = function () { try { var r = document.createRange(); r.selectNodeContents(t); var s = window.getSelection(); s.removeAllRanges(); s.addRange(r) } catch (x) {} };
    try { navigator.clipboard.writeText(text).then(ok, sel) } catch (x) { sel() }
  });

  function stash() { try { sessionStorage.setItem(STASH, JSON.stringify(state)) } catch (e) {} }
  function clearStash() { try { sessionStorage.removeItem(STASH) } catch (e) {} }
  function changed() {
    state.updated = new Date().toISOString();
    if (mode === "local") { saveLocal(); return }
    dirty = true; stash(); showStatus();
    clearTimeout(saveTimer); saveTimer = setTimeout(save, 2000);
  }
  function saveLocal() { try { localStorage.setItem(STASH, JSON.stringify(state)) } catch (e) {} showStatus() }
  function goLocal() {
    mode = "local"; dirty = false;
    try { var l = JSON.parse(localStorage.getItem(STASH) || "null"); if (l && l.checked) state = l } catch (e) {}
    render();
  }

  var RESET_CSS = ":root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}";
  function documentHtml() {
    var S = "script", fonts = document.querySelector('link[rel="stylesheet"][href*="fonts.googleapis"]');
    var json = JSON.stringify(state).replace(/</g, "\\u003c");
    return "<!doctype html><html><head><meta charset=utf8><meta name=viewport content=\"width=device-width,initial-scale=1,viewport-fit=cover\"><style>" + RESET_CSS + "</style></head><body>" +
      "<title>Custodian Release Checklist</title>\n<meta name=\"claude:viewport-fit-sides\" content=\"cover\">\n" +
      "<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n" +
      "<link rel=\"stylesheet\" href=\"" + (fonts ? fonts.getAttribute("href") : "") + "\">\n" +
      "<style id=\"app-style\">" + document.getElementById("app-style").textContent + "</style>\n\n" +
      "<main id=\"app\">\n  <header>\n    <h1>Custodian Release Checklist</h1>\n    <p class=\"sub\">Standing Orders: Custodian, the next release.</p>\n  </header>\n  <p class=\"sub\" id=\"loading\">Loading the checklist…</p>\n</main>\n\n" +
      "<" + S + " type=\"application/json\" id=\"state\">" + json + "</" + S + ">\n" +
      "<" + S + " id=\"app-script\">" + document.getElementById("app-script").textContent + "</" + S + ">\n" +
      "</body></html>";
  }
  function save() {
    if (!artifact || mode !== "shared") return;
    stash();
    artifact.publish(documentHtml()).then(function () { clearStash(); dirty = false; showStatus() }, function (err) {
      var code = err && err.code;
      if (code === "conflict") return;
      if (code === "rate_limited") { saveTimer = setTimeout(save, 8000); return }
      if (code === "upstream_error") { saveTimer = setTimeout(save, 3000 + Math.random() * 2000); return }
      clearStash(); goLocal(); saveLocal();
    });
  }

  render();
  if (window.claude && window.claude.use) {
    window.claude.use("artifact").then(function (a) {
      if (!a) { goLocal(); return }
      artifact = a; mode = "shared";
      var saved; try { saved = JSON.parse(stateEl.textContent) } catch (e) { saved = {} }
      if (JSON.stringify(saved) !== JSON.stringify(state)) { dirty = true; clearTimeout(saveTimer); saveTimer = setTimeout(save, 1500) }
      else clearStash();
      showStatus();
    }, goLocal);
  } else goLocal();
})();
</script>
